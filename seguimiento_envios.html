  "¡Gracias por responder! Hacemos cajas para tenis y zapatos, normales o con tu logo, desde pocas unidades y con precio por cantidad. ¿Cuántos pares despachas más o menos al mes? Así te paso precios exactos.",
  "¡Genial! En Jetta_Sk manejamos cajas para calzado en varias tallas y también personalizadas. Si me cuentas qué medidas y qué cantidad necesitas, te armo la cotización hoy mismo."
];
const OFERTA_MP = [
  "¡Gracias por responder! En Jetta_Sk diseñamos cajas para calzado con el logo, los colores y los acabados de su marca, para que cada par llegue con la presentación que merece. ¿Me cuentan cuántos pares despachan al mes y qué tallas manejan, para preparar la propuesta con precios?",
  "¡Qué bueno! Hacemos cajas personalizadas para marcas de calzado: logo impreso, colores de la marca y medidas a la talla. ¿Cuántos pares sacan al mes? Con eso les preparo ejemplos y precios."
];
const nombreCorto = d => d.nombre.split(" (")[0].split(" / ")[0];
const esMP = d => d.grupo === "mp";
function primerMensaje(d, rot){
  const cierres = esMP(d) ? CIERRES_MP : CIERRES;
  const s = SALUDOS[rot % SALUDOS.length], p = PRESENTA[(rot*3+1) % PRESENTA.length], c = cierres[(rot*5+2) % cierres.length];
  return (s+" "+p+" "+c).replaceAll("{n}", nombreCorto(d));
}
function oferta(d, rot){ const o = esMP(d) ? OFERTA_MP : OFERTA; return o[rot % o.length]; }

// ---------- Estado guardado ----------
const KEY = "jetta_prospeccion_v2";
let S = { c:{}, rot:0, activo:"business" };   // c[id] = {estado, fecha, numero, mensaje, primerTs, ofertaTs, oferta, asignado, ts}
function cargar(){
  try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.c) S = Object.assign(S, v); } catch(e){}
  try { // migración de la versión anterior de la página
    const viejo = JSON.parse(localStorage.getItem("jetta_estados") || "{}");
    for (const [id,v] of Object.entries(viejo)) if (!S.c[id] && v && v.estado && v.estado!=="pendiente") S.c[id] = {estado:v.estado, fecha:v.fecha||"", ts: v.fecha ? Date.parse(v.fecha+"T12:00:00-05:00") : 1};
  } catch(e){}
}
function guardarHistorial(){
  try {
    const k="jetta_historial_contactos", prev=JSON.parse(localStorage.getItem(k)||"null");
    const porId={}; ((prev&&prev.contactos)||[]).forEach(c=>porId[c.id]=c); HIST.contactos.forEach(c=>porId[c.id]=Object.assign({},porId[c.id]||{},c));
    const desc=((prev&&prev.descartados)||[]).concat(HIST.descartados||[]).filter((d,i,a)=>a.findIndex(x=>x.nombre===d.nombre&&x.fecha===d.fecha)===i);
    localStorage.setItem(k, JSON.stringify({actualizado:new Date().toISOString(), contactos:Object.values(porId), descartados:desc}));
  } catch(e){}
}
function guardarLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch(e){ return false; } }
const reg = id => S.c[id] || {estado:"pendiente"};
const now = () => Date.now();
const diaCO = ts => new Date(ts - CO).toISOString().slice(0,10);
function fechaCO(ts){ const d=new Date(ts-CO); const m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getUTCMonth()]; return d.getUTCDate()+" "+m+" · "+String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0"); }
function hastaMedianoche(){ const t=now(), d=new Date(t-CO); const sig=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+1)+CO; return sig-t; }
const mmss = ms => { const s=Math.ceil(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };

// ---------- Reparto entre los dos números (1 de cada 3 al normal, 2 de cada 3 al Business, como sus límites) ----------
const AUTO = {}; { let k=0; for (const d of DATA) if (d.num) { AUTO[d.id] = (k % 3 === 0) ? "normal" : "business"; k++; } }
const asignado = d => d.num ? (reg(d.id).asignado || AUTO[d.id]) : "directo";

// ---------- Contadores por número ----------
function usoHoy(n){
  const hoy = diaCO(now()); let c=0, ultimo=0;
  for (const v of Object.values(S.c)) if (v.numero===n && v.primerTs){ if (diaCO(v.primerTs)===hoy) c++; if (v.primerTs>ultimo) ultimo=v.primerTs; }
  return {c, ultimo};
}
function puerta(n){ // estado del número: ok / espera / lleno
  const u = usoHoy(n), lim = NUMS[n].limite;
  if (u.c >= lim) return {tipo:"lleno", u};
  const falta = u.ultimo + GAP - now();
  if (falta > 0) return {tipo:"espera", falta, u};
  return {tipo:"ok", u};
}

// ---------- Duplicados: el mismo número o perfil en varias listas ----------
const clave = d => d.num ? "wa:"+d.num : "p:"+(d.perfil||d.id).toLowerCase().replace(/\/$/,"");
function contactadoEn(d){
  const k = clave(d);
  for (const o of DATA) if (o.id!==d.id && clave(o)===k && reg(o.id).estado!=="pendiente") return o;
  return null;
}

// ---------- Guardado en la cuenta (db) además de localStorage ----------
let col = null, cola = Promise.resolve();
function setSave(cls, txt){ const s=document.getElementById("save"); s.className="save "+cls; document.getElementById("saveText").textContent=txt; }
function subir(id){
  if (!col) return;
  const v = Object.assign({}, S.c[id] || {estado:"pendiente"});
  cola = cola.then(()=>col.doc(id).set(v)).then(()=>setSave("ok","Guardado en este navegador y en tu cuenta · "+fechaCO(now()).split(" · ")[1]))
             .catch(()=>setSave("bad","Guardado en este navegador. No se pudo subir a tu cuenta; exporta un respaldo."));
}
function cambiar(id, cambios){
  S.c[id] = Object.assign({}, reg(id), cambios, {ts: now()});
  guardarLocal(); subir(id);
}

// ---------- Acciones ----------
function enviarPrimero(d, numero, msg){
  if (reg(d.id).estado !== "pendiente" || contactadoEn(d)) return false;
  cambiar(d.id, {estado:"enviado", fecha:diaCO(now()), numero, mensaje:msg, primerTs:now()});
  S.rot++;           // el siguiente mensaje usa otra combinación de saludo, presentación y cierre
  guardarLocal();
  return true;
}
function toast(t){ const x=document.getElementById("toast"); x.textContent=t; x.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>x.classList.remove("on"),2600); }
async function copiar(txt){
  try { await navigator.clipboard.writeText(txt); return true; }
  catch(e){ const a=document.createElement("textarea"); a.value=txt; document.body.appendChild(a); a.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} a.remove(); return ok; }
}

// ---------- Render ----------
let lista = (()=>{ const h=location.hash.slice(1); return ["todas","anterior","nueva","costa","meta","lista5"].includes(h)?h:"anterior"; })();
const el = (t,c,x)=>{ const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; };

function panelNumeros(){
  for (const n of ["normal","business"]){
    const b=document.getElementById("num-"+n), p=puerta(n), lim=NUMS[n].limite;
    b.setAttribute("aria-pressed", String(S.activo===n)); b.textContent="";
    const top=el("div","top"); top.appendChild(el("span","lab",NUMS[n].label)); top.appendChild(el("span","act", S.activo===n ? "Usando" : "Tocar para usar")); b.appendChild(top);
    const cnt=el("div","cnt"); cnt.appendChild(el("b",null,String(p.u.c))); cnt.appendChild(document.createTextNode(" de "+lim+" mensajes nuevos hoy")); b.appendChild(cnt);
    const m=el("div","meter"); const s=el("span"); s.style.width=Math.min(100,p.u.c/lim*100)+"%"; m.appendChild(s); b.appendChild(m);
    const st = p.tipo==="lleno" ? el("div","st full","Límite de hoy alcanzado") : p.tipo==="espera" ? el("div","st wait","Próximo mensaje en "+mmss(p.falta)) : el("div","st ok","Listo para enviar");
    b.appendChild(st);
  }
  const ms=hastaMedianoche(), h=Math.floor(ms/3600000), mi=Math.floor(ms%3600000/60000);
  document.getElementById("reset").textContent = "Los contadores se reinician a la medianoche, hora de Colombia (faltan "+h+" h "+mi+" min). WhatsApp normal: máximo 10 al día · Business: máximo 20 · 3 minutos entre mensajes del mismo número.";
}

function botonPrincipal(d){
  const r = reg(d.id), dup = contactadoEn(d), n = asignado(d);
  if (r.estado !== "pendiente") return {dis:true, txt: r.estado==="no interesado" ? "No interesado" : "Ya contactado"};
  if (dup) return {dis:true, txt:"Ya se le escribió ("+LISTAS[dup.lista]+")"};
  if (d.posible && !r.noDup) return {dis:true, txt:"Posible repetido", posible:true};
  if (n === "directo") return {dm:true, txt:"Copiar mensaje"};
  if (n !== S.activo) return {dis:true, txt:"Es de "+NUMS[n].label, mover:true};
  const p = puerta(n);
  if (p.tipo==="lleno") return {dis:true, txt:"Límite de hoy alcanzado"};
  if (p.tipo==="espera") return {dis:true, txt:"Espera "+mmss(p.falta), espera:true};
  return {wa:true, txt:"Abrir WhatsApp"};
}

function fila(d){
  const r = reg(d.id), n = asignado(d), msgNuevo = primerMensaje(d, S.rot);
  const row = el("div","row"+(r.estado!=="pendiente"?" done":"")+(r.estado==="no interesado"?" no":"")+(d.posible&&!r.noDup&&r.estado==="pendiente"?" posible":"")); row.dataset.id=d.id;
  const info = el("div"); info.style.minWidth="0";
  info.appendChild(el("div","name",d.nombre));
  const meta = el("div","meta");
  if (lista==="todas") meta.appendChild(el("span","chip",LISTAS[d.lista]));
  meta.appendChild(el("span","chip",d.ciudad));
  meta.appendChild(el("span","chip",d.tamano));
  if (typeof d.seg==="number") meta.appendChild(el("span","chip",(d.seg>=1000?(d.seg/1000).toFixed(d.seg>=10000?0:1).replace(".0","")+"K":d.seg)+" seguidores"));
  if (esMP(d)) meta.appendChild(el("span","chip mp","Marca propia"));
  if (d.posible && !r.noDup) meta.appendChild(el("span","chip dup","⚠ Posible repetido de "+d.posible.de+" ("+d.posible.lista+") · "+d.posible.motivo));
  if (d.num){ meta.appendChild(el("span","chip "+(d.grupo==="pv"?"pv":"num-c"),"+57 "+d.num)); meta.appendChild(el("span","chip "+n,"📱 "+NUMS[n].label)); }
  else meta.appendChild(el("span","chip",d.red||"Mensaje directo"));
  info.appendChild(meta);
  if (r.estado==="pendiente"){
    info.appendChild(el("div","prev","Mensaje que se enviará: "+msgNuevo));
  } else {
    const s = el("div","sent");
    const desde = r.numero==="directo" ? "por mensaje directo" : r.numero ? "desde "+NUMS[r.numero].label : "desde un número no registrado";
    s.appendChild(el("b",null, (r.primerTs ? "Enviado el "+fechaCO(r.primerTs) : "Enviado el "+(r.fecha||"—"))+" "+desde+". "));
    if (r.mensaje){ const q=el("q",null,r.mensaje); s.appendChild(q); }
    if (r.ofertaTs) s.appendChild(el("div","date","Oferta enviada el "+fechaCO(r.ofertaTs)));
    info.appendChild(s);
  }
  const act = el("div","act");
  const b = botonPrincipal(d);
  if (b.wa){
    const a = el("a","btn wa "+n+" wa-btn", b.txt); a.dataset.n=n;
    a.href = "https://wa.me/57"+d.num+"?text="+encodeURIComponent(msgNuevo); a.target="_blank"; a.rel="noopener";
    a.addEventListener("click", ev=>{ const p=puerta(n); if (p.tipo!=="ok" || !enviarPrimero(d, n, msgNuevo)) { ev.preventDefault(); return; } toast("Enviado desde "+NUMS[n].label+". Próximo mensaje de este número en 3 minutos."); setTimeout(render,0); });
    act.appendChild(a);
  } else if (b.dm){
    const c = el("button","btn dm",b.txt); c.type="button";
    c.addEventListener("click", async ()=>{ const ok=await copiar(msgNuevo); if (enviarPrimero(d,"directo",msgNuevo)) render(); toast(ok?"Mensaje copiado. Abre su perfil y pégalo en el chat.":"No se pudo copiar: mantén presionado el texto del mensaje para copiarlo."); });
    act.appendChild(c);
  } else {
    const x = el("button","btn"+(b.espera?" wa-btn":""), b.txt); x.disabled=true; if (b.espera) x.dataset.n=n; act.appendChild(x);
    if (b.posible){ const ok=el("button","btn link","Es otro negocio: habilitar"); ok.type="button"; ok.addEventListener("click",()=>{ cambiar(d.id,{noDup:true}); render(); }); act.appendChild(ok); }
    if (b.mover){ const mv=el("button","btn link","Pasar a "+NUMS[S.activo].label); mv.type="button"; mv.addEventListener("click",()=>{ cambiar(d.id,{asignado:S.activo}); render(); }); act.appendChild(mv); }
  }
  if (r.estado==="respondió" || r.estado==="interesado"){
    const of = oferta(d, S.rot);
    if (d.num){
      const ao = el("a","btn ghost","Enviar oferta"); ao.href="https://wa.me/57"+d.num+"?text="+encodeURIComponent(of); ao.target="_blank"; ao.rel="noopener";
      ao.addEventListener("click",()=>{ cambiar(d.id,{ofertaTs:now(), oferta:of}); S.rot++; guardarLocal(); setTimeout(render,0); });
      act.appendChild(ao);
    } else {
      const co = el("button","btn ghost","Copiar oferta"); co.type="button";
      co.addEventListener("click", async ()=>{ await copiar(of); cambiar(d.id,{ofertaTs:now(), oferta:of}); S.rot++; guardarLocal(); render(); toast("Oferta copiada."); });
      act.appendChild(co);
    }
  }
  if (d.perfil && d.perfil.startsWith("https://")){ const p=el("a","btn ghost","Ver perfil"); p.href=d.perfil; p.target="_blank"; p.rel="noopener"; act.appendChild(p); }
  const sel = el("select"); sel.id="estado-"+d.id; sel.setAttribute("aria-label","Estado de "+d.nombre);
  EST.forEach(e=>{ const o=el("option",null,e); o.value=e; if (e===r.estado) o.selected=true; sel.appendChild(o); });
  sel.addEventListener("change", ()=>{
    const v = sel.value;
    if (v==="pendiente") cambiar(d.id, {estado:"pendiente", fecha:"", numero:"", mensaje:"", primerTs:0, ofertaTs:0, oferta:""});
    else cambiar(d.id, {estado:v, fecha: reg(d.id).fecha || diaCO(now())});
    render();
  });
  act.appendChild(sel);
  row.appendChild(info); row.appendChild(act);
  return row;
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed", String(t.dataset.lista===lista)));
  panelNumeros();
  const fE=document.getElementById("fEstado").value, fN=document.getElementById("fNum").value, fB=document.getElementById("fBuscar").value.trim().toLowerCase();
  const base = DATA.filter(d => lista==="todas" || d.lista===lista);
  const cuenta={}; EST.forEach(e=>cuenta[e]=0); base.forEach(d=>cuenta[reg(d.id).estado]=(cuenta[reg(d.id).estado]||0)+1);
  const st=document.getElementById("stats"); st.textContent="";
  EST.forEach(e=>{ const x=el("span","stat"); x.appendChild(el("b",null,String(cuenta[e]||0))); x.appendChild(document.createTextNode(" "+e)); st.appendChild(x); });
  const items = base.filter(d=>{
    const r=reg(d.id), n=asignado(d);
    if (fE && r.estado!==fE) return false;
    const nd = (r.estado!=="pendiente" && r.numero) ? r.numero : n;   // número con el que se escribió, o el asignado si aún está pendiente
    if (fN==="activo" && nd!==S.activo) return false;
    if (fN && fN!=="activo" && nd!==fN) return false;
    if (fB && !(d.nombre+" "+d.ciudad).toLowerCase().includes(fB)) return false;
    return true;
  });
  pintarContador(base);
  const g=document.getElementById("groups"); g.textContent="";
  const grupos = ORDEN_GRUPO.filter(k=>items.some(d=>d.grupo===k));
  if (!grupos.length){ const e=el("div","list"); e.appendChild(el("div","empty","No hay tiendas con estos filtros.")); g.appendChild(e); return; }
  for (const k of grupos){
    const rows = items.filter(d=>d.grupo===k).map((d,i)=>({d,i}))
      .sort((a,b)=>{ const ea=reg(a.d.id).estado, eb=reg(b.d.id).estado; const libre=x=>reg(x.id).estado==="pendiente"&&!contactadoEn(x)&&!(x.posible&&!reg(x.id).noDup); const pa=libre(a.d)?0:1, pb=libre(b.d)?0:1;
                     return pa-pb || ORDEN[ea]-ORDEN[eb] || a.i-b.i; });
    const pend = rows.filter(x=>reg(x.d.id).estado==="pendiente").length;
    const h=el("h2",null,(GRUPOS[k]||[k])[0]+" "); h.appendChild(el("small",null,rows.length+" tiendas · "+pend+" pendientes · "+(GRUPOS[k]||["",""])[1])); g.appendChild(h);
    const box=el("div","list"); rows.forEach(x=>box.appendChild(fila(x.d))); g.appendChild(box);
  }
}

function pintarContador(base){
  const nombreLista = lista==="todas" ? "Todas las listas" : LISTAS[lista];
  const posibles = base.filter(d=>d.posible && !reg(d.id).noDup).length;
  const nuevos = base.length - posibles;
  const etiqueta = lista==="todas" ? null : LISTAS[lista];
  const desc = (HIST.descartados||[]).filter(x=>!etiqueta || x.lista===etiqueta).length;
  const box=document.getElementById("dupbar"); box.textContent="";
  const s1=el("span"); s1.appendChild(el("b",null,String(nuevos))); s1.appendChild(document.createTextNode(" contactos nuevos · ")); s1.appendChild(el("b",null,String(desc))); s1.appendChild(document.createTextNode(" repetidos descartados"));
  box.appendChild(s1);
  const s2=el("span"); s2.appendChild(el("b",null,String(posibles))); s2.appendChild(document.createTextNode(" posibles repetidos por revisar")); box.appendChild(s2);
  box.appendChild(el("span",null,nombreLista+" · historial: "+HIST.contactos.length+" contactos entregados"));
}

// Cada segundo: contadores y temporizadores (sin redibujar toda la lista)
let ultimoTipo = {};
setInterval(()=>{
  panelNumeros();
  let cambio=false;
  for (const n of ["normal","business"]){ const t=puerta(n).tipo; if (ultimoTipo[n] && ultimoTipo[n]!==t) cambio=true; ultimoTipo[n]=t; }
  if (cambio) { render(); return; }
  document.querySelectorAll("button.wa-btn[disabled]").forEach(b=>{ const p=puerta(b.dataset.n); if (p.tipo==="espera") b.textContent="Espera "+mmss(p.falta); });
}, 1000);

// ---------- Selector de número, pestañas y filtros ----------
document.querySelectorAll(".num").forEach(b=>b.addEventListener("click",()=>{ S.activo=b.dataset.n; guardarLocal(); render(); }));
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ lista=t.dataset.lista; history.replaceState(null,"","#"+lista); render(); }));
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if (["todas","anterior","nueva","costa","meta","lista5"].includes(h)) { lista=h; render(); } });
EST.forEach(e=>{ const o=el("option",null,e); o.value=e; document.getElementById("fEstado").appendChild(o); });
["fEstado","fNum"].forEach(id=>document.getElementById(id).addEventListener("change",render));
document.getElementById("fBuscar").addEventListener("input",()=>{ clearTimeout(render._t); render._t=setTimeout(render,200); });

// ---------- Respaldo ----------
function respaldo(){ return JSON.stringify({app:"Envíos Jetta_Sk", version:2, exportado:new Date().toISOString(), rot:S.rot, activo:S.activo, contactos:S.c, historial:HIST}, null, 1); }
document.getElementById("exp").addEventListener("click", async ()=>{
  const nombre = "respaldo_envios_jetta_"+diaCO(now())+".json", data = respaldo();
  let dl=null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
  if (dl){ try { await dl.save({filename:nombre, data}); toast("Respaldo guardado."); return; } catch(e){ if (e && e.code==="declined") return; } }
  try { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); toast("Respaldo descargado."); }
  catch(e){ const ok = await copiar(data); toast(ok?"No se pudo descargar: copié el respaldo; pégalo en una nota.":"No se pudo exportar."); }
});
document.getElementById("imp").addEventListener("click",()=>document.getElementById("impFile").click());
document.getElementById("impFile").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try {
      const j=JSON.parse(rd.result); const c=j.contactos||j.c; if (!c || typeof c!=="object") throw 0;
      let n=0;
      for (const [id,v] of Object.entries(c)){
        if (!DATA.some(d=>d.id===id) || !v || !EST.includes(v.estado)) continue;
        if (!S.c[id] || (v.ts||0) > (S.c[id].ts||0)){ S.c[id]=v; subir(id); n++; }
      }
      if (typeof j.rot==="number") S.rot=Math.max(S.rot,j.rot);
      guardarLocal(); render(); toast("Respaldo importado: "+n+" tiendas actualizadas.");
    } catch(err){ toast("Ese archivo no es un respaldo de esta página."); }
    e.target.value="";
  };
  rd.readAsText(f);
});

// ---------- Inicio ----------
cargar(); guardarHistorial(); render();
if (!guardarLocal()) setSave("bad","Este navegador no deja guardar: exporta un respaldo al terminar.");
(async ()=>{
  let db=null; try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){}
  if (!db){ document.getElementById("toolsNote").textContent="Abierta fuera de Claude: guarda en este navegador. Exporta un respaldo de vez en cuando."; return; }
  col = db.collection("seguimiento");
  setSave("","Conectando con tu cuenta…");
  const timer=setTimeout(()=>setSave("bad","Tu cuenta no responde todavía; lo que marques queda en este navegador."),10000);
  let primera=true;
  col.onSnapshot(snap=>{
    const remotos={};
    snap.docs.forEach(doc=>{ const v=doc.data(); if (!v || !EST.includes(v.estado)) return;
      const ts = v.ts || (v.actualizado ? Date.parse(v.actualizado) : 0); remotos[doc.id]=Object.assign({}, v, {ts}); });
    for (const [id,v] of Object.entries(remotos)) if (!S.c[id] || (v.ts||0) > (S.c[id].ts||0)) S.c[id]=v;
    if (!snap.metadata.fromCache && primera){
      primera=false; clearTimeout(timer);
      for (const [id,v] of Object.entries(S.c)) if (!remotos[id] || (v.ts||0) > (remotos[id].ts||0)) subir(id);
      setSave("ok","Guardado en este navegador y en tu cuenta");
    }
    guardarLocal(); render();
  }, ()=>{ clearTimeout(timer); setSave("bad","No se pudo conectar con tu cuenta. Lo que marques queda en este navegador."); });
})();
</script>
