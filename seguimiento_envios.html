const EST = ["pendiente","enviado","respondió","interesado","no interesado"];
const GRUPOS = {
  nueva: [["wa","WhatsApp","número confirmado en su TikTok, su web o el link de su bio"],["ig","Instagram","copia el mensaje y envíalo por mensaje directo"],["tt","TikTok","copia el mensaje y envíalo por mensaje directo"]],
  anterior: [["wa","WhatsApp verificado","número confirmado en su perfil o web"],["pv","Por verificar","número tomado de Google: revisa el perfil antes de escribir"],["sin","Sin WhatsApp","escríbeles por mensaje directo"]]
};
let estados = {};            // id -> {estado, fecha}
let db = null, col = null;   // guardado en el servidor
let modo = "cargando";       // "servidor" | "local" | "cargando"
let lista = (location.hash === "#anterior") ? "anterior" : "nueva";
let soloPend = false;

function lsGet(){ try { return JSON.parse(localStorage.getItem("jetta_estados") || "{}"); } catch(e){ return {}; } }
function lsSet(){ try { localStorage.setItem("jetta_estados", JSON.stringify(estados)); } catch(e){} }
function hoy(){ const t=new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
function seg(v){ if (typeof v!=="number") return null; return (v>=1000 ? (v/1000).toFixed(v>=10000?0:1).replace(".0","")+"K" : String(v))+" seguidores"; }
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function toast(t){ const x=document.getElementById("toast"); x.textContent=t; x.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>x.classList.remove("on"),2400); }
function setSave(state, text){ const s=document.getElementById("save"); s.className="save "+state; document.getElementById("saveText").textContent=text; }

async function guardar(id, estado){
  const fecha = estado==="pendiente" ? "" : ((estados[id]&&estados[id].fecha) || hoy());
  estados[id] = {estado, fecha};
  lsSet();                                   // copia inmediata en este navegador
  render();
  if (col){
    try { await col.doc(id).set({estado, fecha, actualizado: new Date().toISOString()}); setSave("ok","Guardado en tu cuenta · "+new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})); }
    catch(e){ setSave("bad","No se pudo guardar en tu cuenta. Quedó solo en este navegador."); }
  }
}
function marcarEnviado(id){ const s=estados[id]; if(!s || s.estado==="pendiente") guardar(id,"enviado"); }

async function copiar(txt){
  try { await navigator.clipboard.writeText(txt); return true; }
  catch(e){ const a=document.createElement("textarea"); a.value=txt; document.body.appendChild(a); a.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} a.remove(); return ok; }
}

function fila(d){
  const s = estados[d.id] || {estado:"pendiente", fecha:""};
  const row = el("div","row"+(s.estado!=="pendiente"?" sent":"")); row.dataset.id=d.id;
  const info = el("div"); info.style.minWidth="0";
  info.appendChild(el("div","name",d.nombre));
  const meta = el("div","meta");
  meta.appendChild(el("span","chip",d.ciudad));
  meta.appendChild(el("span","chip",d.tamano));
  const sg=seg(d.seg); if(sg) meta.appendChild(el("span","chip",sg));
  if(d.num) meta.appendChild(el("span","chip "+(d.grupo==="pv"?"pv":"num"),"+57 "+d.num));
  if(d.fuente) meta.appendChild(el("span",null,d.fuente));
  info.appendChild(meta);
  const act = el("div","act");
  if (d.num && (d.grupo==="wa" || d.grupo==="pv")){
    const a = el("a","btn wa","Abrir WhatsApp");
    a.href = "https://wa.me/57"+d.num+"?text="+encodeURIComponent(d.msg); a.target="_blank"; a.rel="noopener";
    a.addEventListener("click", ()=>marcarEnviado(d.id));
    act.appendChild(a);
  } else {
    const b = el("button","btn dm","Copiar mensaje"); b.type="button";
    b.addEventListener("click", async ()=>{ const ok=await copiar(d.msg); toast(ok?"Mensaje copiado. Ábrelo en "+(d.red||"su perfil")+" y pégalo.":"No se pudo copiar: mantén presionado el texto para copiarlo."); marcarEnviado(d.id); });
    act.appendChild(b);
  }
  if (d.perfil && d.perfil.startsWith("https://")){
    const p = el("a","btn ghost","Ver perfil"); p.href=d.perfil; p.target="_blank"; p.rel="noopener"; act.appendChild(p);
  }
  const sel = el("select"); sel.id="estado-"+d.id; sel.setAttribute("aria-label","Estado de "+d.nombre);
  EST.forEach(e=>{ const o=el("option",null,e); o.value=e; if(e===s.estado) o.selected=true; sel.appendChild(o); });
  sel.addEventListener("change", ()=>guardar(d.id, sel.value));
  act.appendChild(sel);
  act.appendChild(el("span","date",s.fecha||""));
  row.appendChild(info); row.appendChild(act);
  return row;
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed", String(t.dataset.lista===lista)));
  const items = DATA.filter(d=>d.lista===lista);
  const cuenta = {}; EST.forEach(e=>cuenta[e]=0);
  items.forEach(d=>cuenta[(estados[d.id]||{}).estado||"pendiente"]++);
  const st = document.getElementById("stats"); st.textContent="";
  EST.forEach(e=>{ const x=el("span","stat"); x.appendChild(el("b",null,String(cuenta[e]))); x.appendChild(document.createTextNode(" "+e)); st.appendChild(x); });
  const g = document.getElementById("groups"); g.textContent="";
  GRUPOS[lista].forEach(([key,titulo,nota])=>{
    let rows = items.filter(d=>d.grupo===key);
    const total = rows.length;
    if (soloPend) rows = rows.filter(d=>((estados[d.id]||{}).estado||"pendiente")==="pendiente");
    const h = el("h2",null,titulo+" "); h.appendChild(el("small",null,total+" tiendas · "+nota)); g.appendChild(h);
    const box = el("div","list");
    if (!rows.length) box.appendChild(el("div","empty", soloPend ? "No quedan pendientes en este grupo." : "Sin tiendas."));
    rows.forEach(d=>box.appendChild(fila(d)));
    g.appendChild(box);
  });
}

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ lista=t.dataset.lista; history.replaceState(null,"","#"+lista); render(); }));
document.getElementById("soloPend").addEventListener("change",e=>{ soloPend=e.target.checked; render(); });
window.addEventListener("hashchange",()=>{ lista=(location.hash==="#anterior")?"anterior":"nueva"; render(); });

  const timer = setTimeout(()=>{ if(modo==="cargando") setSave("bad","El guardado en tu cuenta no responde todavía. Lo que marques se guarda en este navegador."); }, 10000);
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
  if (!db){ clearTimeout(timer); modo="local"; setSave("bad","Abierto fuera de Claude: el avance se guarda solo en este navegador."); return; }
  col = db.collection("seguimiento");
  col.onSnapshot(snap=>{
    const remoto = {};
    snap.docs.forEach(doc=>{ const v=doc.data(); if(v && typeof v.estado==="string" && EST.includes(v.estado)) remoto[doc.id]={estado:v.estado, fecha:typeof v.fecha==="string"?v.fecha:""}; });
    // lo marcado en este navegador antes de conectar y que el servidor aún no tiene, se sube una vez
    if (!snap.metadata.fromCache && modo!=="servidor"){
      const pendientes = Object.keys(estados).filter(id=>!remoto[id] && estados[id].estado!=="pendiente" && DATA.some(d=>d.id===id));
      (async()=>{ for (const id of pendientes){ try{ await col.doc(id).set({...estados[id], actualizado:new Date().toISOString()}); }catch(e){} } })();
      pendientes.forEach(id=>remoto[id]=estados[id]);
      modo="servidor"; clearTimeout(timer); setSave("ok","Guardado en tu cuenta: tu avance queda aunque cierres la página");
    }
    estados = (modo==="servidor") ? remoto : Object.assign({}, estados, remoto);
    lsSet(); render();
  }, err=>{ clearTimeout(timer); modo="local"; setSave("bad","No se pudo conectar con el guardado. Lo que marques se guarda en este navegador."); });
})();
</script>
