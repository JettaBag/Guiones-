<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5f6b7a;--line:#e3e6ea;--accent:#1a8f4e;--accent-text:#fff;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1b1e22;--text:#e8eaed;--muted:#9aa4b0;--line:#2c3138;--accent:#27a95f;--accent-text:#fff;--chip:#262a30}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1e22;--text:#e8eaed;--muted:#9aa4b0;--line:#2c3138;--accent:#27a95f;--accent-text:#fff;--chip:#262a30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:18px;margin:32px 0 8px;display:flex;gap:12px;align-items:baseline}
h2 small{font-weight:400;color:var(--muted);font-size:14px}
p.sub{color:var(--muted);margin:0 0 20px}
.cfg{display:flex;flex-wrap:wrap;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.cfg label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);flex:1 1 200px}
.cfg input{margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
.warn{color:#b26a00;font-size:13px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.bar button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:14px}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.name{font-weight:600}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
a.wa{background:var(--accent);color:var(--accent-text);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;white-space:nowrap}
a.prof{color:var(--muted);font-size:13px}
a.wa.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.chip.ok{background:#d9f2e3;color:#14663a}.chip.warn2{background:#fbe8cc;color:#8a4b00}
@media (prefers-color-scheme:dark){.chip.ok{background:#173a26;color:#8fe0b0}.chip.warn2{background:#3d2a10;color:#f2c27e}}
select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px}
.date{font-size:12px;color:var(--muted);min-width:72px;text-align:right}
.row.done .name{opacity:.6}
@media (max-width:640px){.row{grid-template-columns:24px 1fr}.act{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>

const EST=["pendiente","enviado","respondió","interesado","no interesado"];
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st=store.get("seg2",{});
function msg(d){return d.msg}
function link(d){return "https://wa.me/57"+d.num+"?text="+encodeURIComponent(msg(d))}
function hoy(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rowHTML(d,i){const s=st[d.nombre]||{estado:"pendiente",fecha:""};
 const badge=d.ver==="verificado"?`<span class="chip ok">✔ verificado</span>`:`<span class="chip warn2">sin verificar</span>`;
 const btn=d.num?`<a class="wa ${d.ver==="verificado"?"":"alt"}" target="_blank" rel="noopener" href="${link(d)}">Abrir WhatsApp</a>`:"";
 return `<div class="row ${s.estado!=="pendiente"?"done":""}" data-k="${esc(d.nombre)}">
 <div class="n">${i}</div>
 <div><div class="name">${esc(d.nombre)}</div><div class="meta"><span class="chip">${esc(d.ciudad)}</span><span class="chip">${esc(d.tamano)}</span>${badge}<span>${esc(d.src)}</span></div></div>
 <div class="act">${btn}<a class="prof" target="_blank" rel="noopener" href="${esc(d.perfil)}">Ver perfil</a>
 <select>${EST.map(e=>`<option ${e===s.estado?"selected":""}>${e}</option>`).join("")}</select>
 <span class="date">${s.fecha||""}</span></div></div>`}
function render(){
 const ok=DATA.filter(d=>d.num&&d.ver==="verificado"),pv=DATA.filter(d=>d.num&&d.ver!=="verificado"),sin=DATA.filter(d=>!d.num);
 const dias=[...new Set(ok.map(d=>d.dia))];let h="",i=0;
 for(const dd of dias){const g=ok.filter(d=>d.dia===dd);
  h+=`<h2>Día ${dd} <small>${g.length} tiendas · número verificado en su perfil o web</small></h2><div class="list">${g.map(d=>rowHTML(d,++i)).join("")}</div>`}
 h+=`<h2>Por verificar <small>${pv.length} tiendas · número tomado de Google: abre "Ver perfil" y confirma antes de escribir</small></h2><div class="list">${pv.map((d,j)=>rowHTML(d,j+1)).join("")}</div>`;
 h+=`<h2>Sin WhatsApp <small>${sin.length} tiendas · escribirles por DM</small></h2><div class="list">${sin.map((d,j)=>rowHTML(d,j+1)).join("")}</div>`;
 document.getElementById("days").innerHTML=h;
 const c={};EST.forEach(e=>c[e]=0);DATA.forEach(d=>c[(st[d.nombre]||{}).estado||"pendiente"]++);
 document.getElementById("stats").textContent=EST.map(e=>`${e}: ${c[e]}`).join(" · ");
}
function setEst(id,estado,fecha){const prev=st[id]||{};st[id]={estado,fecha:fecha!==undefined?fecha:(prev.fecha||"")};store.set("seg2",st);render()}
document.getElementById("days").addEventListener("click",e=>{const a=e.target.closest("a.wa");if(!a)return;const id=a.closest(".row").dataset.k;
 if(((st[id]||{}).estado||"pendiente")==="pendiente")setTimeout(()=>setEst(id,"enviado",hoy()),0)});
document.getElementById("days").addEventListener("change",e=>{if(e.target.tagName!=="SELECT")return;const id=e.target.closest(".row").dataset.k;
 const v=e.target.value;setEst(id,v,v==="pendiente"?"":((st[id]||{}).fecha||hoy()))});
document.getElementById("exp").addEventListener("click",()=>{
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const lines=[["nombre","ciudad","tamaño","WhatsApp","verificación","estado","fecha de envío"].map(q).join(",")];
 DATA.forEach(d=>{const s=st[d.nombre]||{estado:"pendiente",fecha:""};lines.push([d.nombre,d.ciudad,d.tamano,d.num?"+57 "+d.num:"no encontrado",d.ver,s.estado,s.fecha].map(q).join(","))});
 const b=new Blob(["﻿"+lines.join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="seguimiento_"+hoy()+".csv";a.click()});
render();
</script>
